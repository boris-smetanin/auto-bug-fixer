# Local-dev configuration with hot reload, split into two services.
#
# - `server` runs the Hono API with `tsx watch` on ${PORT:-3000}.
# - `web` runs the Vite dev server with HMR on ${WEB_PORT:-5173}. Vite
#   proxies /api and /healthz to the `server` container via the compose
#   network (resolved by service name).
# - Both services bind-mount the host source into /app so edits reload
#   instantly. Each gets anonymous volumes on its node_modules so the
#   container's Linux native bindings (e.g. better-sqlite3) stay isolated
#   from the host's macOS binaries.
# - Logs filter cleanly per service:
#     docker compose logs -f server
#     docker compose logs -f web
# - For the production-shaped single-container run, use compose.prod.yml.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   open http://localhost:${WEB_PORT:-5173}   # Vite dev UI (proxies /api)

services:
  server:
    container_name: abf-server
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    entrypoint: /app/docker-entrypoint.sh
    command: sh -c "npm install && npm run dev:server"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
      - /app/shared/node_modules
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped

  web:
    container_name: abf-web
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: sh -c "npm install && npm run dev:web"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/web/node_modules
      - /app/shared/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      # Vite (in this container) proxies API calls to the server container,
      # reached via the compose network on its service name.
      VITE_PROXY_TARGET: http://server:${PORT:-3000}
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    depends_on:
      - server
    restart: unless-stopped
